[ledger]
code = "dl"
name = "taskledger"

[project]
name = "taskledger"
uuid = "4d81f840-c8df-49b8-b0cb-416a4b34d5dc"

[storage]
documentledger_dir = ".documentledger"

[scan]
source_roots = ["taskledger", "tests/test_service_boundaries.py"]
doc_roots = ["docs"]
source_extensions = [".py"]
doc_extensions = [".md"]

[validation]
commands = [
  "pytest tests/test_docs_and_skill.py tests/test_command_example_linter.py",
  "sphinx-build -W -b html docs docs/_build/html",
]

[policy]
require_doc_frontmatter = false

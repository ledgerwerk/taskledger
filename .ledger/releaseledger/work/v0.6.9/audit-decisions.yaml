      - tests/test_lock_diagnostics.py
      - tests/test_lock_lease_renewal.py
      - tests/test_taskledger_v2_cli.py
    observed_behavior:
      "Lock ownership classification now requires strong execution identity
      (shared harness session ID, stable same-host owner PID, or matching actor identity)
      and exposes the active_current_execution and active_harness_session classifications.
      implement resume reacquires only lost or expired locks and returns an already_active
      no-op payload with changed=false when the current execution owns the active run,
      while foreign or unknown non-expired holds still raise LOCK_CONFLICT with diagnostics.
      Successful todo done renews the active implementation lease only when the current
      execution proves ownership; read-only commands and other sessions never renew it."
    public_impact: public
    decision: accepted
    target_entry_key: null

  observed_behavior: "Adds dry-run-first maintenance cleanup for old unreferenced artifacts, terminal workspace snapshots, and quarantined index generations, with path safety checks and durable reports; adds explicit repairs that quarantine incomplete task allocations and remove orphan locks while preserving audit state. Reduces project-wide index rebuilds through indexed task summaries, bound-path readers, incremental derived-index updates with dirty markers, and opt-in timing diagnostics."

  - section_id: md:section:docs/command_contract.md::code-review-commands
    doc_path: docs/command_contract.md
    heading_path:
      - CLI Command Contract
      - Code review commands
    heading_slug: code-review-commands
    line_span:
      - 560
      - 608
    section_hash: 7b6fb56c9a5a18d283949bc012b2c08b61e6a024e4dcd6badfaa22b4c188b1bb
    summary: Code review commands
    text:
      "## Code review commands\n\n`review` stores optional durable code-review evidence\
      \ without adding a new\nlifecycle stage. Review evidence may be recorded before\
      \ validation or after a\ntask has reached `done`; storing the review remains append-only\
      \ and does not\nreopen the completed task:\n\n```bash\ntaskledger review record\
      \ [--task TASK_REF] --result pass|fail|blocked (--summary TEXT | --summary-file\
      \ PATH) [--from-git] [--commit COMMIT] [--worker STEP_ID] [--handoff HANDOFF_ID]\
      \ [--run RUN_ID]\ntaskledger review list [--task TASK_REF]\ntaskledger review\
      \ show REVIEW_REF [--task TASK_REF]\n```\n\nJSON mode returns a stable payload\
      \ with `kind = \"code_review_recorded\"` for\n`review record` and includes `review_id`,\
      \ `task_id`, `result`,\n`source`, `implementation_run`, `worker_step_id`, and\
      \ compact git\nmetadata fields when present.\n\nWhen a user explicitly asks an\
      \ agent for a review, the agent should persist\nthe final review with `taskledger\
      \ review record` before answering. A\nchat-only review is not durable task evidence.\
      \ Post-completion review\nrecords are append-only and do not reopen the task.\n\
      \nFocused worker contexts keep lifecycle `mode` separate from worker-role\n`--for`:\n\
      \n```bash\ntaskledger context --for planner|implementer|validator|spec-reviewer|code-reviewer|reviewer|full\
      \ [--scope task|todo|run] [--todo TODO_ID] [--run RUN_ID] [--format markdown|json|text]\
      \ [--task TASK_REF]\ntaskledger handoff create --mode planning|implementation|validation|review|full\
      \ [--for planner|implementer|validator|spec-reviewer|code-reviewer|reviewer|full]\
      \ [--scope task|todo|run] [--todo TODO_ID] [--run RUN_ID] [--task TASK_REF]\n\
      taskledger handoff create --worker STEP_ID [--scope task|todo|run] [--todo TODO_ID]\
      \ [--run RUN_ID] [--task TASK_REF]\ntaskledger pipeline context STEP_ID [--scope\
      \ task|todo|run] [--todo TODO_ID] [--run RUN_ID] [--format markdown|json|text]\
      \ [--task TASK_REF]\ntaskledger handoff show HANDOFF_ID --format text|markdown|json\
      \ [--task TASK_REF]\n```\n\nRules:\n\n- `--todo` implies `--scope todo`.\n- `--run`\
      \ implies `--scope run`.\n- `--scope todo` requires `--todo`.\n- `--scope run`\
      \ requires `--run`.\n- `--for implementation|validation|planning|review|full`\
      \ remain accepted as\n  compatibility aliases.\n- `handoff create --worker` derives\
      \ mode and context from the configured\n  worker step and stores `worker_step_id`\
      \ in the handoff record.\n- `pipeline context STEP_ID` is equivalent to `context\
      \ --worker STEP_ID`.\n- `spec-reviewer` and `code-reviewer` worker contexts require\
      \ `--run` or\n  explicit `--scope task` when they are not bound to a validation/review\
      \ run.\n- `handoff show --format markdown` prints the stored snapshot body."

    summary: Lock recovery contract
    text:
      "## Lock recovery contract\n\nLock diagnostics are exposed through three surfaces:\n\
      \n- `taskledger lock show --task TASK` returns a `diagnostics` object and\n  a\
      \ structured human block. The `classification` field names the lock\n  state:\
      \ `none`, `expired`, `active_dead_local_process`,\n  `active_live_local_process`,\
      \ `active_unverifiable_remote_or_unknown_process`,\n  `active_no_pid`, `active_same_actor`,\
      \ or `active_other_actor`.\n- `taskledger --json next-action` returns `lock_status`\
      \ whenever a lock\n  exists, and sets `action=repair-lock` with a diagnostics\
      \ blocker when the\n  active implementation lock has a dead local holder PID.\n\
      - `taskledger implement resume --repair-expired-lock` returns a\n  `LOCK_CONFLICT`\
      \ error (exit code 4) with diagnostics and remediation\n  commands when the existing\
      \ lock is non-expired.\n\n`--repair-expired-lock` is not a general stale-lock\
      \ takeover flag. It only\napplies to locks whose `expires_at` is in the past.\
      \ For non-expired active\nlocks, follow the classification returned by `lock show`\
      \ or `next-action`.\n\nFor non-expired active locks classified as `active_dead_local_process`,\
      \ the\ncanonical recovery sequence is:\n\n```bash\ntaskledger repair lock --task\
      \ TASK --reason \"Holder PID ... is no longer running.\"\ntaskledger implement\
      \ resume --task TASK --reason \"Reacquire implementation lock after stale holder\
      \ repair.\"\n```\n\nFor `active_live_local_process` or `active_other_actor`, do\
      \ not repair;\nuse a handoff or wait for the holder to release. For\n`active_unverifiable_remote_or_unknown_process`,\
      \ do not infer staleness\nfrom local process checks; inspect handoffs or ask the\
      \ user before repairing."

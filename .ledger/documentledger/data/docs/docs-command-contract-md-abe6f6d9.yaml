    section_hash: 1e0ed4dea8fa578e2ef82f1b6b6bd4a5e0eaaf61cb9a5a4a857d661d20e8e265
    summary: Plan check command
    text:
      "## Plan check command\n\n`taskledger plan check` validates editable plan\
      \ input without creating,\nrevising, proposing, accepting, locking, or releasing\
      \ anything:\n\n```bash\ntaskledger plan check [--task TASK_REF] [--file PATH]\
      \ [--strict]\n```\n\nRules:\n\n- `--file` defaults to `plan.md` when omitted;\n\
      - `--strict` upgrades unknown-field warnings to errors and fails on any warning;\n\
      - task context is optional; `task_id` appears in the payload when resolvable;\n\
      - JSON uses the root `--json` option:\n  ```bash\n  taskledger --json plan check\
      \ --file ./plan.md\n  ```\n\nPayload shape:\n\n- `kind` (`plan_input_check`)\n\
      - `task_id`\n- `passed`\n- `strict`\n- `summary` (`{errors, warnings}`)\n- `issues`\n\
      - `parsed`"

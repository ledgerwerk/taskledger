    section_hash: e7c178004f6f377134f0a5a30bc96810d72eb5e3c65ca2ee47216cc7fc89fba5
    summary: Plan revision commands
    text: '## Plan revision commands


      `taskledger plan export` renders an editable plan draft outside durable

      storage, and `taskledger plan amend` applies structured plan-review edits:


      ```bash

      taskledger plan export [--task TASK_REF] [--version latest|N] [--file PATH] [--overwrite]
      [--stdout]

      taskledger plan amend [--task TASK_REF] [--drop-criterion CRITERION_ID ...] [--drop-todo
      TODO_ID ...] [--remove-file PATH ...] --reason "..."

      ```


      Plan proposal commands that accept `--file` reject file paths under

      `.taskledger/` because that directory is private durable ledger state.'

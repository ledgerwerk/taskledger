    section_hash: b57ce2794e18807257e7d3d0b3cbfe8a91cf83bb58e3f0675d795aa1f01f4489
    summary: Storage Compatibility
    text: "## Storage Compatibility


      Taskledger stores canonical project configuration in schema-3 `.ledger/ledger.toml`

      and Taskledger config in `.ledger/taskledger/config.toml`. Legacy

      `taskledger.toml` and `.taskledger.toml` remain readable for explicit migration.


      The default `data` mount is persistent external storage at `../ledger`; `indexes`

      is cache storage. A local `.ledger/ledger.local.toml` may select `user-data`.

      Commands keep `--root` scoped to the source workspace, not the storage root.


      Taskledger uses:


      - storage layout version 5 in the UUID-scoped data root's `storage.yaml`

      - schema-2 canonical ledger state

      - per-record `schema_version`

      - per-record `object_type`

      - per-file `file_version` for durable Markdown/YAML/JSON record files


      Storage layout history is maintained by explicit migration receipts. The

      current layout keeps branch-scoped ledgers under

      `<data-root>/ledgers/<ledger_ref>/`.


      Taskledger does not silently rewrite storage during read-only commands.


      If the installed taskledger version can read but not write an older workspace,

      it reports that migration is required.


      To migrate:


      ```bash

      taskledger storage validate

      taskledger migrate plan

      taskledger migrate apply

      ```


      After migration to layout 5, verify health with:


      ```bash

      taskledger doctor

      taskledger ledger doctor

      ```


      Checkout-scoped indexes under the resolved cache mount are optional derived

      caches or registries. Read-only commands continue to work from canonical

      Markdown/YAML records and do not initialize a missing cache. Before a canonical

      mutation, Taskledger initializes a missing or empty cache binding and rebuilds

      the derived indexes. A non-empty cache without its binding marker is atomically

      quarantined beside the cache and rebuilt from canonical records. Conflicting or

      invalid markers, symlinks, and non-directory cache paths are not adopted

      automatically. The remaining derived caches may be plain JSON arrays with no

      version metadata and can be rebuilt explicitly with:


      ```bash

      taskledger reindex

      ```


      `taskledger repair index` uses the same recovery path and reports any quarantine

      location. The `indexes` mount is fixed to cache storage, so

      `taskledger storage set indexes cache` is an idempotent topology request;

      non-cache indexes storage is rejected directly.


      A newer storage version than the installed taskledger supports is rejected with

      a clear error."

    section_hash: 25aeb732f345e0ccd5a1f0fc0e11be7a5131453744dc4af432840b28101b8809
    summary: Plan guidance command
    text:
      "## Plan guidance command\n\n`taskledger plan guidance` is a read-only planning\
      \ helper command that always\nprints built-in plan-input guidance. When a project\
      \ prompt profile is configured\nit appends project-local advisory guidance:\n\n\
      ```bash\ntaskledger plan guidance [--task TASK_REF] [--format markdown|json]\n\
      ```\n\nRules:\n\n- defaults to the active task when `--task` is omitted;\n- `--format`\
      \ accepts only `markdown` or `json`;\n- when a planning run is active, it records\
      \ a one-time guidance-view marker for\n  that run and appends a `plan.guidance.viewed`\
      \ event;\n- root `--json` continues to return the standard CLI success/error envelope;\n\
      - `has_project_guidance` indicates whether a project prompt profile exists,\n\
      \  not whether any guidance is available. Built-in guidance is always returned.\n\
      \nThe command payload shape is:\n\n- `kind`\n- `task_id`\n- `has_project_guidance`\n\
      - `guidance`\n- `profile`\n- `question_policy`"

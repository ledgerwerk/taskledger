    summary: CLI Command Contract
    text: "# CLI Command Contract


      Taskledger uses a task-first command grammar:


      ```text

      taskledger [--root PATH] [--json] <area> <verb> [RESOURCE_REF] [--task TASK_REF]
      [options]

      ```"

    section_hash: 979fa25aa32878abf09618699739ddc7af5717ec6a8d76e36066dfbb4372603e
    summary: Storage and sync helper commands
    text:
      "## Storage and sync helper commands\n\nTaskledger also exposes local storage\
      \ discovery and sync helpers:\n\n```bash\ntaskledger storage where\ntaskledger\
      \ storage move --to ../taskledger-state/project-a --mode copy|move [--adopt-existing]\
      \ [--force]\ntaskledger sync preflight\ntaskledger sync status\ntaskledger sync\
      \ commit --message \"Sync project-a taskledger state\"\ntaskledger sync export\
      \ --output ./taskledger-transfer.tar.gz\ntaskledger sync import ./taskledger-transfer.tar.gz\
      \ --dry-run\ntaskledger sync git status\ntaskledger sync git init --repo ../taskledger-state\
      \ --project-path project-a\ntaskledger sync git commit --message \"Sync project-a\
      \ taskledger state\"\ncd \"$(taskledger sync git cd)\"\ngit pull --ff-only\ngit\
      \ push\ntaskledger sync git hooks install\ntaskledger sync git hooks status\n\
      taskledger sync git hooks uninstall\n```\n\nRules:\n\n- `storage where` is read-only\
      \ and reports the resolved workspace root,\n  config path, `taskledger_dir`, project\
      \ identity, ledger ref, Git detection,\n  and active lock count.\n- In legacy\
      \ projects, `storage move` updates `taskledger.toml` atomically after the target\
      \ has\n  been copied or explicitly adopted.\n- `sync preflight` performs only\
      \ local checks. It must not perform network\n  push/pull operations.\n- `sync\
      \ status` and `sync commit` operate only on the Git repository that\n  contains\
      \ the resolved `taskledger_dir`.\n- `sync export` and `sync import` are archive\
      \ aliases for the root\n  `export`/`import` commands.\n- `sync git` commands operate\
      \ on a private external Git repository that stores\n  full project taskledger\
      \ state under `<repo>/<project_path>`."

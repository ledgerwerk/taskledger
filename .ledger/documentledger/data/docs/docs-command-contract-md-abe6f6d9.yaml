    section_hash: 1860353b2b10cf0bdec8ebb497092384ad5daef257a0d2d25ff3eb6f4f2e7df7
    summary: "`next-action` result contract"
    text:
      "## `next-action` result contract\n\n`taskledger next-action` is the preferred\
      \ fresh-context entrypoint for agents\nand operators. It should identify the next\
      \ concrete question, todo, criterion,\nplan, dependency, or repair target instead\
      \ of only naming a lifecycle bucket.\n\nHuman output should stay concise but actionable:\n\
      \n```text\ntodo-work: Implementation is in progress; 1 todos remain.\nNext todo:\
      \ todo-0001 -- Update next-action JSON payload.\nCommand: taskledger todo show\
      \ todo-0001\nWorker step: tester\nWorker context: taskledger pipeline context\
      \ tester\nWorker handoff: taskledger handoff create --worker tester --summary\
      \ \"...\"\nMark todo done after evidence exists: taskledger todo done todo-0001\
      \ --evidence \"...\"\nProgress: 0/1 todos done\n```\n\nJSON output preserves the\
      \ existing fields:\n\n- `kind`\n- `task_id`\n- `status_stage`\n- `active_stage`\n\
      - `action`\n- `reason`\n- `blocking`\n- `next_command`\n\nand may also include:\n\
      \n- `next_item` for the concrete target\n- `commands` for ordered command hints\
      \ with one primary command\n- `progress` for question, todo, or validation queues\n\
      - `worker_pipeline` when an enabled `guided` worker pipeline has a pending\n \
      \ step; this object includes `enabled`, `mode`, `next_step`,\n  `context_command`,\
      \ and `handoff_command`\n- `template_command` plus `required_plan_fields` and\n\
      \  `recommended_plan_fields` when the next step is regenerating a plan from\n\
      \  answered questions\n- `guidance_command` when planning guidance should be reviewed\
      \ before drafting\n  or regenerating a plan\n\nAgents should inspect `next_item`,\
      \ prefer `next_command` when it is safe,\navoid inventing question answers, and\
      \ never mark todos done without evidence.\n\nWhen a task is in `failed_validation`,\
      \ `next-action` should direct agents\nback to implementation with `taskledger\
      \ implement restart --summary SUMMARY`.\n\nWhen a task persists `planning`, `implementing`,\
      \ or `validating` as its\nstatus but `active_stage` is missing, `next-action`\
      \ must not report\n`The task is cancelled.` For an orphaned implementation with\
      \ a still-running\nlatest implementation run and no active lock, it should direct\
      \ agents to\n`taskledger implement resume --task TASK_REF --reason \"...\"`.\n\
      \nFor an implemented task whose validation is blocked by `IMPLEMENTATION_SNAPSHOT_MISMATCH`,\n\
      `next-action` must point to `validate-reconcile` and the audited recovery command\n\
      `taskledger implement snapshot refresh --reason \"...\"`, not to `implement restart`\
      \ unless\nthe task is actually in `failed_validation`.\nFor an approved task with\
      \ a non-implementation run still marked running,\n`next-action` must not direct\
      \ agents to `taskledger implement start`.\nIt should report a repair-oriented\
      \ action and point to `taskledger doctor`.\nTruly cancelled tasks recover through\n\
      `taskledger task uncancel --task TASK_REF --reason \"...\"`"

    section_hash: 734b7f1e90e04f4826fc6674ad9dd815dfe0a5ac97c4a62cf14f36608df086b5
    summary: plan subcommands
    text: "## plan subcommands


      - Normal path: `plan start` -> `plan guidance` -> `plan template` -> `plan check`
      -> `plan upsert` -> `plan lint` -> `plan accept`

      - Support reads/records: `plan show`, `plan review`, `plan list`, `plan diff`,
      `plan export`, `plan command -- ...`

      - Advanced or compatibility paths: `plan approve`, `plan propose`, `plan draft`,
      `plan regenerate --from-answers`, `plan materialize-todos`, `plan revise`, `plan
      amend`, `plan reject`


      Prefer `plan accept` for explicit chat approval. `plan approve` remains for

      advanced metadata control and compatibility."

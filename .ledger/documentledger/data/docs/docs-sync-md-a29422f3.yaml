    section_hash: 24c66933cd2ef4ff81e9f49b9938c30f1e05bdde6d9bd99bbfd0bdbfe33f1e35
    summary: Canonical mounts
    text: "## Canonical mounts


      Canonical state sync includes the durable `data` mount by default. `runtime`,
      `logs`, and cache `indexes` are excluded from application-source sync; indexes
      can be deleted and rebuilt from data. An explicit audit policy may include selected
      logs. Workspace, user-data, and cache roots are resolved by Ledgercore and are
      not changed by `taskledger storage move`."

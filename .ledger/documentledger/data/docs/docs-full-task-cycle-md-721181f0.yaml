    section_hash: a9d3bd4945c09ff7161851e00ed5e2630a2b1e0c1e108f0c0a2f72bd57a63c50
    summary: 5. Propose A Plan
    text: '## 5. Propose A Plan


      Write the plan body in a Markdown file and propose it:


      ```bash

      taskledger plan draft

      taskledger plan upsert --file ./plan.md --criterion "Parser rejects unmatched
      delimiters." --criterion "Regression tests cover nested expressions."

      taskledger plan show --version 1

      taskledger plan diff --from 1 --to 1

      ```


      `plan upsert` ends the active planning run and creates a reviewable plan

      version. Acceptance criteria become validation criteria such as `ac-0001`.


      If answers changed after the plan was proposed, regenerate before approval:


      ```bash

      taskledger question answer-many --text "q-0001: Reject unmatched delimiters and
      keep the original token offset."

      taskledger plan upsert --from-answers --file ./plan-v2.md

      taskledger plan show --version 2

      ```


      Regeneration keeps the durable answer snapshot aligned with the plan.


      For diagnostic commands needed during planning (linting, test runs, code

      inspection), preserve their output with `plan command`:


      ```bash

      taskledger plan command -- pytest tests/test_parser.py -q

      taskledger plan command -- python -m compileall taskledger

      ```


      `plan command` records command exit code, stdout, stderr, and actual child cwd
      in

      planning diagnostics. It passes the inner argv without a shell and runs from the
      CLI

      invocation directory. Workspace discovery may use an ancestor for Taskledger state,

      but it must not change the managed child''s cwd. With transcript logging enabled,
      the

      same output is also captured in the ledger-level command transcript. Use it to
      build

      evidence into the plan before proposal.


      Managed planning commands use a usable inherited Python virtualenv when present,

      then inspect `.venv` and `venv` beside the command cwd and at the workspace root.

      This affects only child executable lookup, so the portable examples above retain

      their exact argv, direct no-shell execution, and documented child cwd.'

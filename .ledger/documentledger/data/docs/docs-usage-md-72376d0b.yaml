    section_hash: e15ad3959122128dd1caebdc4e30cf94400d857a5f60e9cd7d1c2c3fdb80f22c
    summary: Release boundary tags
    text: '## Release boundary tags


      Use taskledger only to record the task boundary for a release. Taskledger does
      not

      manage changelog entries or edit [docs/changelog.md](changelog.md); that belongs
      to the separate

      `releaseledger` tool.


      ```bash

      taskledger release tag 0.4.1 --at-task task-0030 --note "0.4.1 released"

      taskledger release show 0.4.1

      taskledger release list

      ```


      Release boundaries must point to done tasks. When the user asks for release notes,

      changelog entries, or [docs/changelog.md](changelog.md) updates, use `releaseledger`.
      Load both

      skills when cross-ledger release notes need task context.'

    section_hash: 875c0d465d82be019283cdd770d5046a88dd7e676858152f56682749f573ed44
    summary: Optional worker pipelines
    text:
      "## Optional worker pipelines\n\nProjects may optionally configure worker\
      \ pipelines in\n`.ledger/taskledger/config.toml` to\nguide fresh-context handoffs\
      \ without changing the underlying task lifecycle.\nWorker pipelines are advisory\
      \ overlays on the existing planning,\nimplementation, and validation lifecycle.\
      \ They can be three steps, four steps,\nfive steps, or custom. When no worker\
      \ pipeline is configured, taskledger\nbehavior is unchanged.\n\nExample configuration:\n\
      \n```toml\n[worker_pipeline]\nenabled = true\nname = \"api-contract-first\"\n\
      mode = \"guided\"\n\n[[worker_pipeline.steps]]\nid = \"planner\"\nlifecycle_stage\
      \ = \"planning\"\nbase_context = \"planner\"\n\n[[worker_pipeline.steps]]\nid\
      \ = \"tester\"\nlabel = \"Test Writer\"\nlifecycle_stage = \"implementation\"\n\
      base_context = \"implementer\"\nactor_role = \"implementer\"\nkind = \"check\"\
      \ndescription = \"Add or update failing tests before code changes.\"\nrequired_output\
      \ = [\"New or updated failing tests with a short summary.\"]\nmust_not = [\"Do\
      \ not change production code in this step.\"]\ntodo_tag = \"tests\"\ntest_command_policy\
      \ = \"may_fail\"\n\n[[worker_pipeline.steps]]\nid = \"coder\"\nlifecycle_stage\
      \ = \"implementation\"\nbase_context = \"implementer\"\nkind = \"todo\"\ndescription\
      \ = \"Implement the approved change and make the tests pass.\"\nrequired_output\
      \ = [\"Code changes plus passing targeted checks.\"]\nmust_not = [\"Do not skip\
      \ required validation evidence.\"]\ntodo_tag = \"implementation\"\ntest_command_policy\
      \ = \"must_pass\"\n\n[[worker_pipeline.steps]]\nid = \"domain-reviewer\"\nlifecycle_stage\
      \ = \"review\"\nbase_context = \"spec-reviewer\"\nkind = \"review\"\n```\n\nSupported\
      \ top-level keys are `enabled`, `name`, `mode`, and `steps`.\nSupported step keys\
      \ are `id`, `label`, `lifecycle_stage`,\n`base_context`, `actor_role`, `kind`,\
      \ `description`,\n`required_output`, `must_not`, `todo_tag`, and\n`test_command_policy`.\
      \ `guided` mode remains advisory: it does not add\nnew planning, implementation,\
      \ or validation gates. Instead it augments\n`taskledger next-action` with worker-step\
      \ metadata plus ready-to-run worker\ncontext and handoff commands for the pending\
      \ step.\n\nInspect and use the configured overlay explicitly:\n\n```bash\ntaskledger\
      \ pipeline show\ntaskledger pipeline list\ntaskledger pipeline next\ntaskledger\
      \ next-action\ntaskledger pipeline context tester\ntaskledger context --worker\
      \ tester\ntaskledger handoff create --worker tester --summary \"Add failing tests\
      \ only.\"\ntaskledger handoff create --worker domain-reviewer --scope task --summary\
      \ \"Review the implementation.\"\n```\n\nTo include worker-step todo hints in\
      \ a plan template, enable a worker pipeline\nwith `mode = \"template\"` or `mode\
      \ = \"guided\"` and opt in per task:\n\n```bash\ntaskledger plan template --with-worker-pipeline\
      \ --file ./plan.md\n```\n\nUse `worker_step` only on plan todos for projects that\
      \ have an enabled worker\npipeline:\n\n```yaml\ntodos:\n  - id: plan-todo-0001\n\
      \    text: \"Add failing regression tests.\"\n    worker_step: \"tester\"\n  \
      \  validation_hint: \"pytest -q tests/test_parser.py\"\n```"

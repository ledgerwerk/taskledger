    section_hash: c510927f6827cdbfe7b97e2f6d4e97e09090217c7e0232811b97502d98e7e2cd
    summary: Planning guidance profiles
    text:
      "## Planning guidance profiles\n\nTaskledger always provides built-in planning\
      \ guidance via `taskledger plan guidance`.\nProject-local advisory guidance can\
      \ extend this with project-specific advice. Configure\nit in `.ledger/taskledger/config.toml`\
      \ for canonical projects. Legacy\n`taskledger.toml` and `.taskledger.toml` files\
      \ remain readable only during\nexplicit migration.\n\nConfigure `[prompt_profiles.planning]`\
      \ in that active config:\n\n```toml\n[prompt_profiles.planning]\nprofile = \"\
      strict\"\nquestion_policy = \"always_before_plan\"\nmax_required_questions = 3\n\
      min_acceptance_criteria = 2\ntodo_granularity = \"atomic\"\nrequire_files = true\n\
      require_test_commands = true\nrequire_expected_outputs = true\nrequire_validation_hints\
      \ = true\nplan_body_detail = \"detailed\"\nrequired_question_topics = [\"scope\"\
      , \"compatibility\", \"test strategy\"]\nextra_guidance = \"Every plan must mention\
      \ docs, tests, and rollback or repair behavior.\"\n```\n\nAccepted values:\n\n\
      - `profile`: `compact`, `balanced`, `strict`, `exploratory`\n- `question_policy`:\
      \ `ask_when_missing`, `always_before_plan`, `minimal`\n- `todo_granularity`: `minimal`,\
      \ `implementation_steps`, `atomic`\n- `plan_body_detail`: `terse`, `normal`, `detailed`\n\
      - `max_required_questions` and `min_acceptance_criteria` must be positive integers\n\
      - `require_files`, `require_test_commands`, `require_expected_outputs`, and\n\
      \  `require_validation_hints` must be booleans\n- `required_question_topics` must\
      \ be a list of strings\n- `extra_guidance` must be a string up to 4000 characters\n\
      \nInspect guidance for the active task:\n\n```bash\ntaskledger plan guidance\n\
      taskledger plan guidance --task task-0001\ntaskledger --json plan guidance\ntaskledger\
      \ plan guidance --format json\n```\n\nPlanning workflow integration:\n\n```bash\n\
      taskledger plan start\ntaskledger plan guidance\ntaskledger plan template --include-guidance\
      \ --file plan.md\n# edit plan.md\ntaskledger plan check --file plan.md\ntaskledger\
      \ plan upsert --file plan.md\ntaskledger plan lint --version 1\ntaskledger plan\
      \ review --version 1\n```\n\nRevising a proposed plan safely:\n\n```bash\ntaskledger\
      \ plan revise\ntaskledger plan export --version latest --file ./plan.md\n# edit\
      \ ./plan.md (never edit .taskledger/ directly)\ntaskledger plan upsert --file\
      \ ./plan.md\ntaskledger plan diff --from 1 --to 2\n```\n\nFor structured scope\
      \ trims, use:\n\n```bash\ntaskledger plan amend --drop-criterion ac-0007 --drop-todo\
      \ plan-todo-0010 --reason \"User reduced scope.\"\n```\n\nGuidance output is deterministic\
      \ and read-only. It is advisory only and does not\nenforce plan fields by itself.\
      \ It cannot override lifecycle gates, plan approval,\nvalidation requirements,\
      \ lock rules, required user answers, or higher-priority\nharness instructions."

    summary: Recording manually completed work
    text: '## Recording manually completed work


      For work completed outside the task-first lifecycle (operational tasks,

      exploratory work, or manual testing), use `task record` to create a done

      task directly without acquiring locks or lifecycle gates. **Never use**

      `task record` as a shortcut for active task management.


      ```bash

      taskledger task record "Deploy v0.4.1" --summary "Deployed to production" --change
      "deploy.sh:run:Updated config" --evidence "Monitoring shows no errors"

      taskledger task record "Manual testing" --summary "Tested new API endpoints" --allow-empty-record
      --reason "Exploratory testing"

      ```'

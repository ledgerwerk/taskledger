  - section_id: md:section:docs/usage.md::linked-file-baselines-and-drift
    doc_path: docs/usage.md
    heading_path:
      - Usage
      - Fresh-session startup and monitoring
      - Linked file baselines and drift
    heading_slug: linked-file-baselines-and-drift
    line_span:
      - 470
      - 654
    section_hash: 565c0682b0a2719b02f5422e9a5d85073b4deaadf20c5d8e3b154ce177bee5a6
    summary: Linked file baselines and drift
    text:
      "### Linked file baselines and drift\n\nLinked files can now capture a baseline\
      \ snapshot and later report drift:\n\n```bash\ntaskledger file link task-0040\
      \ src/foo.py --kind code --snapshot\ntaskledger file status task-0040\ntaskledger\
      \ file refresh task-0040 src/foo.py --reason \"Rebaseline after accepted implementation\"\
      \n```\n\n`file status` reports `new`, `modified`, `deleted`, `unchanged`, and\n\
      `unbaselined` states. It also keeps `context`: canonical fresh continuation\n\
      context and `handoff show` as the richer advanced/compatibility read\nsurfaces\
      \ when broader state transfer is needed.\n\n`task report` generates a human-readable\
      \ Markdown report for a single task.\nIt is for humans who want to review, archive,\
      \ or share a task outside the terminal.\n\n```bash\ntaskledger task report --task\
      \ task-0030 -o task30.md\ntaskledger task report --preset planning --without todos\
      \ -o plan-review.md\ntaskledger task report --task task-0030 --include command-log\n\
      taskledger task report --task task-0030\n```\n\n`context` is agent-handoff-oriented.\
      \ `task report` and root `report` HTML\ncommands are human-oriented. `task dossier`\
      \ remains available as an\nadvanced/compatibility full-context dump; prefer `context\
      \ --for ...` for new\nagent protocols.\n\n`task transcript` renders a per-task\
      \ command transcript from the ledger-level\nagent log store:\n\n```bash\ntaskledger\
      \ task transcript --task task-0030 -o task30-transcript.md\ntaskledger task transcript\
      \ --task task-0030 --include-output\ntaskledger task transcript --task task-0030\
      \ --raw\ntaskledger task transcript --task task-0030 --failures\ntaskledger --json\
      \ task transcript --task task-0030\n```\n\n`task export` writes a single Markdown\
      \ file containing a curated archive report, raw\nrecord files from the taskledger\
      \ bundle, and optional source-file snapshots.\nUse it when handing a completed\
      \ task to an LLM or coding agent for review,\ndocumentation updates, or follow-up\
      \ implementation work.\n\n```bash\ntaskledger task export task-0030 -o task-0030.llm.md\n\
      taskledger task export task-0030 -o task-0030.records.md\ntaskledger task export\
      \ task-0030 --source-file README.md -o task-0030.llm.md\ntaskledger --json task\
      \ export task-0030 -o task-0030.llm.md\n```\n\nDistinction:\n\n- `task report`:\
      \ human-readable review/archive report.\n- `context`: canonical fresh continuation\
      \ context for an active agent.\n- `handoff show`: durable transfer context created\
      \ for another session or actor.\n- `task dossier`: advanced/compatibility full-context\
      \ dump.\n- `task transcript`: command audit trail.\n- `task export`: single-file\
      \ LLM handoff/archive of one complete task bundle.\n\n```text\ntodo-work: Implementation\
      \ is in progress; 1 todos remain.\nNext todo: todo-0001 -- Update next-action\
      \ JSON payload.\nCommand: taskledger todo show todo-0001\nMark todo done after\
      \ evidence exists: taskledger todo done todo-0001 --evidence \"...\"\nProgress:\
      \ 0/1 todos done\n```\n\n```json\n{\n  \"kind\": \"task_next_action\",\n  \"action\"\
      : \"todo-work\",\n  \"next_command\": \"taskledger todo show todo-0001\",\n  \"\
      next_item\": {\n    \"kind\": \"todo\",\n    \"id\": \"todo-0001\",\n    \"text\"\
      : \"Update next-action JSON payload.\",\n    \"validation_hint\": \"Run: pytest\
      \ tests/test_todo_implementation_gate.py -q; Expected: pass\",\n    \"done_command_hint\"\
      : \"taskledger todo done todo-0001 --evidence \\\"...\\\"\"\n  },\n  \"commands\"\
      : [\n    {\n      \"kind\": \"inspect\",\n      \"label\": \"Show next todo\"\
      ,\n      \"command\": \"taskledger todo show todo-0001\",\n      \"primary\":\
      \ true\n    },\n    {\n      \"kind\": \"complete\",\n      \"label\": \"Mark\
      \ todo done after evidence exists\",\n      \"command\": \"taskledger todo done\
      \ todo-0001 --evidence \\\"...\\\"\",\n      \"primary\": false\n    }\n  ],\n\
      \  \"progress\": {\n    \"todos\": {\n      \"total\": 1,\n      \"done\": 0,\n\
      \      \"open\": 1,\n      \"open_ids\": [\"todo-0001\"]\n    }\n  },\n  \"blocking\"\
      : []\n}\n```\n\nAll approval escape hatches require `--reason`:\n\n```bash\ntaskledger\
      \ plan approve --version 1 --actor user --approval-source explicit_chat --note\
      \ \"Ready.\" --no-materialize-todos --reason \"trivial task\"\ntaskledger plan\
      \ approve --version 1 --actor user --approval-source explicit_chat --note \"Ready.\"\
      \ --allow-empty-criteria --reason \"no criteria needed\"\ntaskledger plan approve\
      \ --version 1 --actor user --approval-source explicit_chat --note \"Ready.\" --allow-lint-errors\
      \ --reason \"user accepted rough plan\"\n```\n\nUse `plan command` to record diagnostic\
      \ commands during planning:\n\n```bash\ntaskledger plan command -- pytest tests/\
      \ -q\ntaskledger plan command --allow-failure -- pytest tests/ -q\ntaskledger\
      \ implement command -- ruff check --config=.ruff.toml .\ntaskledger implement\
      \ command --allow-failure -- python -c \"raise SystemExit(7)\"\n```\n\nWhen `[agent_logging].enabled\
      \ = true` in `.ledger/taskledger/config.toml`, `taskledger`\nrecords CLI invocations\
      \ and managed command outputs. Both managed wrappers execute\nthe exact argv after\
      \ `--` without a shell and from the CLI invocation directory, or\nthe explicit\
      \ `--root` directory. Taskledger may discover an ancestor workspace for\nledger\
      \ state, but that does not change the child's cwd. Human mode displays captured\n\
      stdout/stderr before the summary. JSON mode contains stdout/stderr and cwd only\
      \ in\nthe result object. Keep logging opt-in because stdout/stderr may contain\
      \ sensitive\ndata. Route task-relevant commands through `plan command` and `implement\
      \ command`\nso their output is included in task transcripts and reports.\n\nManaged\
      \ commands use a usable inherited Python virtualenv first, then a valid\n`.venv`\
      \ or `venv` in the command directory or workspace, preferring the command\ndirectory.\
      \ Taskledger adjusts only the child `PATH` and `VIRTUAL_ENV` (and removes\nchild\
      \ `PYTHONHOME` for auto-detected environments); it preserves argv, `PYTHONPATH`,\n\
      the child cwd, no-shell execution, and the parent environment. Use portable forms\n\
      such as `python -m pytest`, `pytest`, `ruff`, or `mypy` rather than hard-coding\
      \ an\nabsolute virtualenv interpreter path.\n\n> taskledger context --for implementation\
      \ --format markdown\n> taskledger implement start\n> taskledger implement log\
      \ --message \"Started implementation.\"\n> taskledger implement change --path\
      \ taskledger/storage/task_store.py --kind edit --summary \"Updated storage semantics.\"\
      \n> taskledger implement scan-changes --from-git --summary \"Implementation diff\
      \ summary.\"\n> taskledger implement finish --summary \"Implemented the approved\
      \ plan.\"\n> taskledger review record --result pass --summary \"No blocking code-quality\
      \ issues.\"\n>\n> taskledger context --for validation --format markdown\n> taskledger\
      \ validate start\n> taskledger validate check --criterion ac-0001 --status pass\
      \ --evidence \"pytest -q tests/test_taskledger_v2_cli.py\"\n> taskledger validate\
      \ finish --result passed --summary \"Validated the rewrite.\"\n\nCode review evidence\
      \ can also be recorded after `validate finish` has moved the\ntask to `done`.\
      \ This appends durable review evidence to the task and does not\nreopen or otherwise\
      \ mutate the task lifecycle stage.\n\nWhen a user explicitly asks an agent for\
      \ a review, the agent should persist\nthe final review with `taskledger review\
      \ record` before answering. A\nchat-only review is not durable task evidence.\
      \ Post-completion review\nrecords are append-only and do not reopen the task.\n\
      \nIf validation finds an implementation bug and the accepted plan is still\ncorrect,\
      \ restart implementation instead of replanning:\n\n```bash\ntaskledger validate\
      \ finish --result failed --summary \"Parser edge case still fails.\"\ntaskledger\
      \ next-action\ntaskledger context --for implementation --format markdown\ntaskledger\
      \ implement restart --summary \"Fix failed validation findings.\"\n```\n\nIf validation\
      \ finds an implementation bug and the accepted plan is still\ncorrect, restart\
      \ implementation instead of replanning:\n\n```bash\ntaskledger validate finish\
      \ --result failed --summary \"Parser edge case still fails.\"\ntaskledger next-action\n\
      taskledger context --for implementation --format markdown\ntaskledger implement\
      \ restart --summary \"Fix failed validation findings.\"\n```"

    section_hash: 39e8da4d2ce5276857a557f47e00bb918303e5adc33f7798586400fe4101ee39
    summary: Canonical project layout
    text: "## Canonical project layout


      Taskledger uses a schema-3 `.ledger/ledger.toml` manifest and `.ledger/taskledger/config.toml`.
      The canonical mounts are durable `data` (external storage rooted at `../ledger`),
      checkout-local `runtime` (user-data), diagnostic `logs` (user-data), and rebuildable
      `indexes` (cache). A machine-local `.ledger/ledger.local.toml` may select `user-data`
      for `data`. Use `taskledger storage where`, `taskledger storage path data|runtime|logs|indexes`,
      `taskledger storage set`, and `taskledger storage clear-override` to inspect or
      change mounts."

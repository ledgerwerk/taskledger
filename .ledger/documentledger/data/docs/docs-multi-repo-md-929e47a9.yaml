    summary: Mental model
    text:
      "## Mental model\n\n- `file add` records task-specific source and implementation\
      \ files.\n- `link add` records issue trackers, design notes, pull requests, or\
      \ other\n  external references.\n- `search`, `grep`, `symbols`, and `deps` are\
      \ read-only helpers.\n- The active task remains explicit. Without an active task,\
      \ task-scoped commands\n  require `--task` or a positional task reference."

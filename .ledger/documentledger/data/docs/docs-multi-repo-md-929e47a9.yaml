    section_hash: 596d48a53a53def91a9b73dcd0cfb4f0fd0cb9d10d7c65a5f1a460d2e5531666
    summary: Common workflow
    text: '## Common workflow


      Create or activate the task first:


      ```bash

      taskledger init

      taskledger task create "Fix sale customization" --description "Repair sale order
      behavior."

      ```


      Attach files from the current workspace or from neighboring checkouts:


      ```bash

      taskledger file add --path ../odoo/addons/sale/models/sale_order.py --kind code
      --label "Upstream sale order reference"

      taskledger file add --path custom_sale/models/sale_order.py --kind code --label
      "Custom sale implementation" --required-for-validation

      taskledger link add --url https://example.invalid/ticket/123 --label "Support
      ticket"

      ```


      Use search helpers to inspect the workspace:


      ```bash

      taskledger search sale_order

      taskledger grep "action_confirm"

      taskledger symbols sale_order.py

      taskledger deps custom_sale.models.sale_order

      ```


      Then render fresh context for the next stage:


      ```bash

      taskledger context --for implementation --format markdown

      taskledger handoff create --mode implementation --intended-actor agent --intended-harness
      codex

      ```'

    summary: CLI→services import whitelist
    text:
      "## CLI→services import whitelist\n\nCLI modules may import from `taskledger.services`\
      \ only when listed in\n`tests/test_service_boundaries.py` under `CLI_SERVICES_IMPORT_WHITELIST`.\n\
      \nCurrent sanctioned imports:\n\n- `taskledger/cli.py:taskledger.services.dashboard`\
      \ — Dashboard and view\n  rendering are currently service-level read models.\n\
      - `taskledger/cli.py:taskledger.services.agent_logging` — Root CLI\n  initializes\
      \ recorder and payload/error notes.\n- `taskledger/cli.py:taskledger.services.tree`\
      \ — Tree rendering currently\n  lives in services/tree.py.\n- `taskledger/cli.py:taskledger.services.doctor`\
      \ — Repair command uses\n  doctor cleanup helper pending API wrapper.\n- `taskledger/cli.py:taskledger.services.monitor`\
      \ — Root monitor command\n  renders the terminal monitor read model.\n- `taskledger/cli.py:taskledger.services.usage`\
      \ — Root usage command renders\n  the fresh-session startup read model.\n- `taskledger/cli_actor.py:taskledger.services.actors`\
      \ — Actor and harness\n  resolution currently lives in services/actors.py.\n-\
      \ `taskledger/cli_common.py:taskledger.services.agent_logging` — CLI common\n\
      \  emits recorder task/payload/error notes.\n- `taskledger/cli_common.py:taskledger.services.actors`\
      \ — CLI common\n  resolves actor/harness context for event metadata.\n- `taskledger/cli_implement.py:taskledger.services.agent_logging`\
      \ —\n  Implement command wrapper records managed-shell command failures.\n- `taskledger/cli_misc.py:taskledger.services.doctor`\
      \ — Doctor commands\n  still consume doctor service inspectors directly.\n- `taskledger/cli_pipeline.py:taskledger.services.handoff`\
      \ — Pipeline\n  context rendering currently reuses the handoff service payloads.\n\
      - `taskledger/cli_pipeline.py:taskledger.services.worker_pipeline` —\n  Pipeline\
      \ CLI commands read the worker pipeline service overlay directly.\n- `taskledger/cli_review.py:taskledger.services.actors`\
      \ — Review commands\n  resolve reviewer/harness context.\n- `taskledger/cli_plan.py:taskledger.services.plan_editing`\
      \ — Plan input\n  path validation currently lives in services/plan_editing.py.\n\
      - `taskledger/cli_plan.py:taskledger.services.plan_lint` — Plan lint\n  payload\
      \ model is still service-owned.\n- `taskledger/cli_question.py:taskledger.services.actors`\
      \ — Question\n  commands resolve actor/harness context.\n- `taskledger/cli_plan.py:taskledger.services.workflow_guidance`\
      \ — Planning\n  guidance profile read model is service-owned.\n- `taskledger/cli_plan.py:taskledger.services.agent_logging`\
      \ — Plan command\n  wrapper records managed-shell command failures.\n- `taskledger/cli_plan.py:taskledger.services.planning_flow`\
      \ — Plan\n  guidance command marks guidance viewed via planning flow service.\n\
      - `taskledger/cli_task.py:taskledger.services.actors` — Task record command\n\
      \  resolves completed-by actor metadata.\n- `taskledger/cli_task.py:taskledger.services.agent_transcripts`\
      \ — Task\n  transcript rendering currently lives in services.\n- `taskledger/cli_task.py:taskledger.services.task_reports`\
      \ — Task report\n  rendering and options are service-owned.\n- `taskledger/cli_task.py:taskledger.services.task_export`\
      \ — Task export\n  service for compiled LLM-ready Markdown.\n- `taskledger/cli_task.py:taskledger.services.tasks`\
      \ — Task events read\n  model and lifecycle mutations.\n- `taskledger/cli_trace.py:taskledger.services.trace`\
      \ — Trace CLI delegates\n  to the trace service.\n- `taskledger/cli_migrate.py:taskledger.services.storage_migration`\
      \ — Migration CLI delegates to the storage migration service.\n\n- `taskledger/cli_runtime.py:taskledger.services.runtime_info`\
      \ — Runtime CLI delegates provenance collection to the runtime service."

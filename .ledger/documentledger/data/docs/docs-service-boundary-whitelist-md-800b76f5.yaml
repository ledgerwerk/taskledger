    section_hash: e7d1653b369e5984c6d1c6da2dbf3963a37f82d92bbd7b2189af78147e927917
    summary: Catch-all exception whitelist (`except Exception`)
    text:
      "## Catch-all exception whitelist (`except Exception`)\n\nCurrent allowed\
      \ sites are listed with reasons in\n`tests/test_service_boundaries.py` under `EXCEPT_EXCEPTION_WHITELIST`.\
      \ Each\ncatch-all key uses the stable form\n`path::qualified_function:except-N`,\
      \ where `N` is the ordinal of the\ncatch-all handler within that function. It\
      \ intentionally does not use source\nline numbers, so unrelated edits above an\
      \ approved handler do not create\npolicy churn.\n\nThe reviewed resilience sites\
      \ include storage validation, migration command\nand hook handling, and project-config\
      \ parsing boundaries listed in the test\nconstants.\n\nPolicy intent:\n\n- Allow\
      \ catch-all handling only in doctor/repair and resilience wrappers.\n- Block new\
      \ catch-all sites unless explicitly reviewed and justified.\n- Require whitelist\
      \ edits to be intentional and reasoned.\n- Fail when a new handler is added, an\
      \ approved handler disappears, or a\n  function gains another catch-all handler."

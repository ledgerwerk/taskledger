    section_hash: c90bd527e1e896ded464ccf66fd7e320bef3580a022c7872437985fb7a8a2833
    summary: Single-task transfer from a config-only checkout
    text: '## Single-task transfer from a config-only checkout


      ```bash

      # fresh checkout on another PC

      taskledger init

      taskledger task create "Fix import edge case" --slug fix-import-edge-case --description
      "..."

      # ... normal plan/implement/validate workflow ...

      taskledger export task-0040


      # main dev repo

      taskledger import ./taskledger-task-planledger-main-task-0040-20260509T101500Z.tar.gz

      taskledger task list

      taskledger task show task-0040

      ```


      Rules:


      - Keep the project UUID in the schema-3 `.ledger/ledger.toml` manifest.

      - Inspect resolved data and index mounts with `taskledger storage where`.

      - Run `taskledger init` after cloning when the configured mounts are absent.

      - `taskledger export --task TASK_REF` and `taskledger export TASK_REF` export
      task-scoped archives.

      - `taskledger sync export` and `taskledger sync import` are aliases for the same
      archive transfer primitives.

      - Task-scoped import is additive by default; if the task id already exists locally,
      import renumbers and reports an id map.

      - `--replace` is for full-state replacement, not the normal single-task workflow.

      - Task IDs are allocated from the active ledger''s task and tombstone inventory;
      imports do not restore a persisted counter.

      - Use the explicit Taskledger Git sync commands when you want to synchronize the
      UUID-scoped sibling data directory between PCs.'

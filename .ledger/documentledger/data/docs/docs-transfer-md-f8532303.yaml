    summary: What transfer archives include
    text:
      "## What transfer archives include\n\n- Current-ledger durable records (tasks,\
      \ plans, questions, runs, changes, todos, links, requirements, events, releases,\
      \ handoffs).\n- Project identity metadata:\n  \\- `project.uuid` (safety identity)\n\
      \  \\- `project.name` (human-facing label)\n  \\- `project.slug` (filename/report\
      \ slug)\n  \\- `project.ledger_ref` (exported ledger)\n- Optional run artifacts\
      \ under `artifacts/` when `--include-run-artifacts` is set."

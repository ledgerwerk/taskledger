    section_hash: 780d4f6f93c6f4393d19896907953f8e069d33c37c2188aa8076de27bc3d55a6
    summary: Owning layers
    text:
      "## Owning layers\n\n- `taskledger/domain/` owns lifecycle enums, policies,\
      \ record models, and the\n  canonical `TASKLEDGER_STORAGE_LAYOUT_VERSION` constant.\n\
      - `taskledger/storage/` owns persisted task bundles, locks, and the\n  `task_sidecars.json`\
      \ summary index. Low-level atomic I/O, JSON I/O, YAML\n  I/O, front matter parsing,\
      \ and cross-ledger ref parsing are delegated to\n  `ledgercore`.\n- `taskledger/services/`\
      \ owns task lifecycle orchestration, including\n  `plan_input.py`, `plan_lint.py`,\
      \ `plan_review.py`, `planning_flow.py`,\n  `implementation_flow.py`, `workspace_snapshot.py`,\
      \ `validation_flow.py`,\n  `handoff.py`, `doctor.py`, and `navigation.py`.\n-\
      \ `taskledger/api/*` exposes stable public wrappers.\n- `taskledger/cli*.py` wires\
      \ Typer commands only."

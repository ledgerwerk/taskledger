    section_hash: eed89878667e36bc7b6472df5717350aa5dfa901f5f6f676d0612ea5239770fc
    summary: Single-task transfer from a config-only checkout
    text:
      "## Single-task transfer from a config-only checkout\n\n```bash\n  # fresh\
      \ checkout on another PC\ntaskledger init\ntaskledger task create \"Fix import\
      \ edge case\" --slug fix-import-edge-case --description \"...\"\n  # ... normal\
      \ plan/implement/validate workflow ...\ntaskledger export task-0040\n\n  # main\
      \ dev repo\ntaskledger import ./taskledger-task-planledger-main-task-0040-20260509T101500Z.tar.gz\n\
      taskledger task list\ntaskledger task show task-0040\n```\n\nRules:\n\n- Keep\
      \ `project_uuid` committed in `taskledger.toml` (or legacy `.taskledger.toml`\
      \ if the project still uses it).\n- `.taskledger/` is local operational state\
      \ and can be absent on another PC.\n- Run `taskledger init` after cloning to create\
      \ local state.\n- `taskledger export --task TASK_REF` and `taskledger export TASK_REF`\
      \ export task-scoped archives.\n- `taskledger sync export` and `taskledger sync\
      \ import` are aliases for the same archive transfer primitives.\n- Task-scoped\
      \ import is additive by default; if the task id already exists locally, import\
      \ renumbers and reports an id map.\n- `--replace` is for full-state replacement,\
      \ not the normal single-task workflow.\n- Import repairs `ledger_next_task_number`\
      \ so future `task create` ids remain unique.\n- Use {doc}`sync` when you want\
      \ to keep an external `taskledger_dir` in a private Git repository and sync full\
      \ project state between PCs."

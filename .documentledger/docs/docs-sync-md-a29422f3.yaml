    section_hash: b882f548c326ea3ed33d55acd9a96d522d77db383ebbed0028cd59937a07a5d3
    summary: Private state Git repo
    text:
      "## Private state Git repo\n\nRecommended layout:\n\n```text\n/home/me/src/project-a/\
      \                  # source repo\n/home/me/src/taskledger-state/           # private\
      \ state repo\n/home/me/src/taskledger-state/project-a/\n  storage.yaml\n  ledgers/\n\
      \    main/\n      tasks/\n      events/\n      releases/\n      indexes/\n```\n\
      \nThe source repository keeps `taskledger.toml` and ignores `.taskledger/`.\n\
      The private state repository stores the external `taskledger_dir` contents."

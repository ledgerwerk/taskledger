    section_hash: e6d790d7cd0f5695a96e75dd594b3ef885abf921b531a197557c141f978913aa
    summary: When to use export/import instead
    text:
      "## When to use export/import instead\n\nArchive commands are still the transfer\
      \ primitive and remain available at both\nthe root and under `sync`:\n\n```bash\n\
      taskledger export task-0040\ntaskledger import ./taskledger-task-project-a-main-task-0040-...tar.gz\n\
      taskledger sync export --output ./taskledger-transfer.tar.gz\ntaskledger sync\
      \ import ./taskledger-transfer.tar.gz --dry-run\n```\n\nIf work must move mid-run,\
      \ prefer task-scoped transfer archives instead of\nsyncing the full live state\
      \ directory:\n\n```bash\ntaskledger export task-0040\n  # copy archive to the\
      \ other PC\ntaskledger import ./taskledger-task-project-a-main-task-0040-...tar.gz\n\
      taskledger next-action\ntaskledger implement resume --reason \"Continue imported\
      \ implementation.\"\n```\n\nImported runtime locks are quarantined by default,\
      \ which makes archive transfer\nsafer than syncing an active lock between machines."

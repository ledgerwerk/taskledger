    summary: Integrity and recovery
    text: '## Integrity and recovery


      ```bash

      taskledger doctor

      taskledger doctor locks

      taskledger lock show

      taskledger repair lock --reason "recover stale planning lock"

      taskledger implement resume --reason "Reacquire implementation lock for existing
      running run."

      taskledger task uncancel --task TASK_REF --reason "Restore the task to a safe
      durable stage."

      taskledger next-action

      taskledger repair index

      ```'

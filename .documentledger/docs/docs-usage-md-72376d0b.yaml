    section_hash: 5e2bf801405ec0f1f814d62074607b472d28bd83a69e3549477fdafd24716b98
    summary: Opaque links and external artifacts
    text: '## Opaque links and external artifacts


      Taskledger stores task-local work state and opaque links.

      Cross-ledger semantics belong to an organizer such as ledgerdeck.

      Use `taskledger link` or `taskledger file` for references to external artifacts;

      Taskledger treats those references as opaque and does not interpret them.


      Local IDs remain the stored identity. Global refs are derived as

      `<ledger.code>:<local_id>`. Canonical output is lowercase colon refs

      (`tl:task-0001`); uppercase and file-safe forms are accepted aliases.

      Task records must not store `global_id`.


      ```bash

      taskledger link add --url specs/behavior/features/checkout/payment.feature --label
      "behavior spec"

      taskledger file link specs/behavior/features/checkout/payment.feature --kind doc
      --label "behavior spec"

      taskledger validate check --criterion ac-0001 --status pass --evidence "pytest
      tests/test_checkout_payment.py::test_payment_flow"

      ```'

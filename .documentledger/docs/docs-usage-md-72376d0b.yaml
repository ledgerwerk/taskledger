    heading_slug: fresh-context-entrypoint
    line_span:
      - 326
      - 387
    section_hash: d97f0718218e87a7e764e55c6a6e506392e83a6c83ede8b212703ddf836d8953
    summary: Fresh-context entrypoint
    text:
      "## Fresh-context entrypoint\n\nUse `taskledger next-action` before a broad\
      \ `context` read when you need the\nnext concrete work item instead of a generic\
      \ stage summary.\n\n```bash\ntaskledger next-action\ntaskledger --json next-action\n\
      ```\n\nHuman output now names the next question, todo, criterion, or repair step\
      \ and\nincludes the primary command hint. JSON output preserves the existing\n\
      `task_next_action` fields and also includes `next_item`, `commands`, and\n`progress`.\n\
      \nAgents should inspect `next_item` first, run `next_command` when it is safe,\n\
      avoid inventing question answers, and only mark todos done after evidence exists.\n\
      \nIf `next-action` reports an orphaned implementation state or an active lock\n\
      recovery situation, inspect the task and lock first, then choose the recovery\n\
      path that matches the lock state:\n\n```bash\ntaskledger task show\ntaskledger\
      \ task show task-0001\ntaskledger lock show\ntaskledger doctor\n```\n\nLock recovery\
      \ decision tree:\n\n1. Run `taskledger lock show --task TASK`. `lock show` reports\
      \ a\n   `classification` field that names the lock state.\n2. If there is no lock,\
      \ run `taskledger next-action`.\n3. If `classification` is `expired` and the lock\
      \ is an implementation lock\n   for a running implementation run:\n   run\n  \
      \ `taskledger implement resume --repair-expired-lock --task TASK --reason \"...\"\
      `.\n4. If `classification` is `active_dead_local_process`:\n   run\n   `taskledger\
      \ repair lock --task TASK --reason \"Holder PID ... is no longer running.\"`,\n\
      \   then `taskledger implement resume --task TASK --reason \"...\"`.\n5. If `classification`\
      \ is `active_live_local_process` or\n   `active_other_actor`:\n   do not repair;\
      \ use a handoff or wait for the holder to release.\n6. If `classification` is\
      \ `active_unverifiable_remote_or_unknown_process`:\n   do not infer staleness\
      \ from local process checks; inspect handoffs or ask\n   the user before repairing.\n\
      7. `next-action` itself returns `action=repair-lock` with diagnostics and\n  \
      \ the recommended command sequence when the active implementation lock has\n \
      \  a dead local holder PID.\n\n`--repair-expired-lock` is not a general stale-lock\
      \ takeover flag. It only\nhandles locks whose `expires_at` is in the past. For\
      \ non-expired active\nlocks, use the decision tree above.\n\nIf the task is actually\
      \ `cancelled` and the user wants to continue, restore it\nwith `task uncancel`\
      \ first, then run `next-action` again. A restored task may\nreturn to a safe durable\
      \ stage such as `approved` while an implementation run\nis still `running`; in\
      \ that case use `implement resume` instead of\n`implement start`."

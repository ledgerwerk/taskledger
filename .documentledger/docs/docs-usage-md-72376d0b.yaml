    section_hash: 3e9f6b352ae1d33becb070b447ec5797b77b3e3406a53820bf29b2d23dc540bb
    summary: Compact implementation loop
    text:
      "## Compact implementation loop\n\nFor routine same-session implementation,\
      \ prefer `next-action` and the next todo\nover a broad generated context read:\n\
      \n```bash\ntaskledger --json next-action\ntaskledger --json todo next\ntaskledger\
      \ todo show todo-0003\n  # implement only that todo\npytest tests/...\ntaskledger\
      \ todo done todo-0003 --evidence \"pytest tests/... passed\"\ntaskledger --json\
      \ next-action\n```\n\nRules for agents:\n\n- Install the `taskledger` skill in\
      \ the coding harness before relying on agent-driven workflows.\n- Prefer `next-action`\
      \ and `todo next` over generated context during normal work.\n- Use the todo `validation_hint`\
      \ before marking a todo done.\n- Record concise evidence with `todo done`.\n-\
      \ Do not create handoffs or context bundles unless the user asked to switch harness\
      \ or session."

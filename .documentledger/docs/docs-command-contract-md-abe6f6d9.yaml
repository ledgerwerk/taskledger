      These aliases are intentionally not registered:


      - `task new`

      - `task clear-active`

      - `implement add-change`

      - `validate add-check`

      - `file unlink`

      - `link link`

      - `link unlink`


      Use `task create`, `task deactivate`, `implement change`,

      `validate check`, `file add`, `file remove`, `link add`, and

      `link remove` instead."

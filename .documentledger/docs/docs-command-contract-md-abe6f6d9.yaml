    section_hash: 85396581640bc6020252e0b464db9117e1124e1904f29c53d9c4804e170e0444
    summary: Plan review command
    text: '## Plan review command


      `taskledger plan review` is a read-only approval-facing plan renderer:


      ```bash

      taskledger plan review [--task TASK_REF] [--version N] [--format markdown|json]
      [-o PATH]

      ```


      Rules:


      - defaults to the active task when `--task` is omitted;

      - defaults to the latest proposed plan in `plan_review` stage when `--version`
      is omitted;

      - renders Markdown by default and can emit JSON-formatted content with `--format
      json`;

      - when `-o/--output` is provided, writes rendered content to a file path.


      Taskledger stores task-local work state and opaque links. Cross-ledger

      semantics belong to an organizer such as ledgerdeck.


      Relevant commands for external artifact references:


      ```bash

      taskledger link add --url specs/behavior/features/checkout/payment.feature --label
      "behavior spec"

      taskledger file link specs/behavior/features/checkout/payment.feature --kind doc
      --label "behavior spec"

      taskledger validate check --criterion ac-0001 --status pass --evidence "pytest
      tests/test_checkout_payment.py::test_payment_flow"

      ```


      Rules:


      - Links are opaque. Taskledger does not parse or interpret linked files.

      - Validation evidence is recorded through generic `validate check`.'

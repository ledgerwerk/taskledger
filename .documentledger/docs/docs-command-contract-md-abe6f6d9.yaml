    section_hash: 0298f433c4af2c7c89f3469f030efb47b773ff8d71b7c785a9d51406853dc16a
    summary: Human monitoring UI
    text:
      "## Human monitoring UI\n\n`taskledger usage` is the compact fresh-session\
      \ startup command:\n\n```bash\ntaskledger usage [TASK_REF] [--task TASK_REF] [-q]\n\
      taskledger --json usage\n```\n\nRules:\n\n- it is read-only and must not claim\
      \ handoffs, repair locks, or mutate task\n  state;\n- root `--json` returns the\
      \ standard CLI envelope with `result.kind == \"usage\"`;\n- it summarizes actor,\
      \ harness, active work, inbox items, and ready tasks;\n- agents should continue\
      \ to use `next-action`, `todo next`, and other JSON\n  commands as the canonical\
      \ same-session automation interface.\n\n`taskledger monitor` is the dependency-free\
      \ human-oriented terminal monitor:\n\n```bash\ntaskledger monitor [TASK_REF] [--task\
      \ TASK_REF] [--refresh-seconds 2] [--once] [--max-events 10] [--max-ready 10]\
      \ [--plain] [--no-clear]\n```\n\nRules:\n\n- it is read-only and never mutates\
      \ `.taskledger/` state;\n- root `--json` prints a single `monitor_snapshot` payload\
      \ and exits;\n- non-JSON mode refreshes on a timer until interrupted;\n- `--plain`\
      \ disables styling and `--no-clear` appends snapshots instead of\n  clearing the\
      \ terminal;\n- it replaces the removed server/TUI surface; agents should keep\
      \ using JSON\n  commands for automation."

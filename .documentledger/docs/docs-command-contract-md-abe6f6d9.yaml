    section_hash: 8449f870f783aead94b00d80a9bb7be2194817f66fe18d944eaf96648cd8623b
    summary: Transfer archive manifest contract
    text:
      "## Transfer archive manifest contract\n\nTransfer archives include both machine\
      \ identity and human-readable metadata:\n`manifest.project.name` and `manifest.project.slug`\
      \ are display metadata,\nwhile `manifest.project.uuid` remains the safety identity.\n\
      \n```json\n{\n  \"project\": {\n    \"uuid\": \"<project_uuid>\",\n    \"name\"\
      : \"<project_name>\",\n    \"slug\": \"<project_slug>\",\n    \"ledger_ref\":\
      \ \"<ledger_ref>\"\n  }\n}\n```\n\nImport compatibility is backward-safe: older\
      \ archives that only contain\n`project.uuid` and `project.ledger_ref` remain valid.\
      \ UUID comparison is\nstill authoritative for import safety.\n\n`taskledger import\
      \ --dry-run` must not mutate taskledger state for either\narchive or JSON payload\
      \ imports."

    section_hash: 558e391a787dfca64a51ac45800ff129194288177d54171810bfd2b6b205f477
    summary: 8. Complete Implementation Todos
    text:
      "## 8. Complete Implementation Todos\n\nMark mandatory todos done with evidence:\n\
      \nCompact same-session loop:\n\n```bash\ntaskledger --json next-action\ntaskledger\
      \ --json todo next\ntaskledger todo show todo-0003\n  # implement only that todo\n\
      pytest tests/test_parser.py -q\ntaskledger todo done todo-0003 --evidence \"pytest\
      \ tests/test_parser.py -q\"\ntaskledger --json next-action\n```\n\nPrefer this\
      \ loop over broad generated context during normal work. Use\n`validation_hint`\
      \ before marking a todo done. Create a handoff or wider\ncontext only when the\
      \ task needs a harness or session switch.\n\n```bash\ntaskledger todo next\ntaskledger\
      \ todo done TODO_ID --evidence \"pytest tests/test_parser.py -q\" --artifact .taskledger-artifacts/parser-test-output.txt\n\
      taskledger todo done TODO_ID --evidence \"Reviewed parser docs.\"\ntaskledger\
      \ todo status\ntaskledger implement finish --summary \"Implemented parser delimiter\
      \ rejection and tests.\"\n```\n\nTodo source is inferred from the active lock:\
      \ todos added during implementation\nare recorded as `source=implementer`, during\
      \ planning as `source=planner`,\nand outside an active stage as `source=user`.\n\
      \n`implement finish` releases the implementation lock only when mandatory todos\n\
      are complete."

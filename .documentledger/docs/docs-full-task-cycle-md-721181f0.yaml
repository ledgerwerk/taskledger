    section_hash: 21684b582f7b783213d44816338a24803947f58d6a99907263a50547f29ba144
    summary: 6. Materialize Todos And Approve
    text:
      "## 6. Materialize Todos And Approve\n\nPlans can include todos in front matter,\
      \ or todos can be added manually. Approval\nmay also materialize structured plan\
      \ todos:\n\n```bash\ntaskledger plan materialize-todos --version 2 --dry-run\n\
      taskledger plan accept --version 2 --note \"Ready to implement.\"\ntaskledger\
      \ todo list\ntaskledger todo add --text \"Add parser regression tests.\" --mandatory\n\
      taskledger todo add --text \"Update parser error message docs.\" --optional\n\
      taskledger todo status\n```\n\nMandatory todos gate implementation completion.\
      \ Optional todos remain visible but\ndo not block `implement finish`.\n\nIf the\
      \ project has an enabled worker pipeline, plan todos may optionally target\nconfigured\
      \ worker steps. This is an advisory overlay, not a new lifecycle stage:\n\n```yaml\n\
      todos:\n  - id: plan-todo-0001\n    text: \"Add failing regression tests.\"\n\
      \    worker_step: \"tester\"\n    validation_hint: \"pytest tests/test_parser.py\
      \ -q\"\n```\n\nUse the worker overlay explicitly:\n\n```bash\ntaskledger pipeline\
      \ next\ntaskledger context --worker tester\ntaskledger handoff create --worker\
      \ tester --summary \"Add failing tests only.\"\n```\n\nAll approval escape hatches\
      \ require `--reason`:\n\n- `--allow-empty-criteria --reason \"...\"`\n- `--allow-open-questions\
      \ --reason \"...\"`\n- `--allow-empty-todos --reason \"...\"`\n- `--no-materialize-todos\
      \ --reason \"...\"`\n\nWithout a reason, the approval command will fail."

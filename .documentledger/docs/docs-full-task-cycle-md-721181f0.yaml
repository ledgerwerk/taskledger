    section_hash: 2037aa90dd4ae76861e0555386900914d10044ea3ffced65c454d19622c90d26
    summary: If validation finds a bug
    text: '### If validation finds a bug


      ```bash

      taskledger validate check --criterion ac-0002 --status fail --evidence "pytest
      tests/test_parser.py -q"

      taskledger validate finish --result failed --summary "ac-0002 failed."

      taskledger next-action

      taskledger context --for implementation --format markdown

      taskledger implement restart --summary "Fix ac-0002 validation failure."

      ```


      If a criterion is intentionally not validated, a user can waive it:


      ```bash

      taskledger validate waive --criterion ac-0003 --reason "Covered by upstream integration
      test." --actor user

      ```


      Waivers should be rare and explicit.'

    summary: 9. Validate The Work
    text: '## 9. Validate The Work


      Start validation, run checks against each acceptance criterion, and finish the

      validation stage:


      ```bash

      taskledger can validate

      taskledger context --for validation --format markdown

      taskledger validate start

      taskledger validate status

      taskledger validate check --criterion ac-0001 --status pass --evidence "pytest
      tests/test_parser.py -q"

      taskledger validate check --criterion ac-0002 --status pass --evidence "pytest
      tests/test_parser.py -q"

      taskledger validate show

      taskledger validate finish --result passed --summary "Parser fix validated with
      regression tests."

      ```'

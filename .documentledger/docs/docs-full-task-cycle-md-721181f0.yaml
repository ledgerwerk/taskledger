    summary: 4. Ask And Answer Questions
    text: '## 4. Ask And Answer Questions


      Questions capture missing decisions before approval:


      ```bash

      taskledger question add --text "Should the parser reject or normalize unmatched
      delimiters?" --required-for-plan

      taskledger question add --text "Which files must validation cover?"

      taskledger question open

      taskledger question answer-many --text "q-0001: Reject unmatched delimiters with
      a clear parse error."

      taskledger question dismiss QUESTION_ID --reason "Validation files are already
      linked."

      taskledger question status

      taskledger question answers --format markdown

      ```


      Use `question answer-many` or `question answer` for decisions that should

      affect the plan. Use `question dismiss` when the question is no longer

      relevant.'

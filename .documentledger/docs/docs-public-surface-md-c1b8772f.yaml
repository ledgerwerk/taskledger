    summary: file subcommands
    text: "## file subcommands


      - `file add`, `file link`, `file remove`, `file list`, `file status`, `file refresh`

      - `file link` records or updates a task-linked file with an optional baseline
      snapshot.

      - `file status` reports `new`, `modified`, `deleted`, `unchanged`, and `unbaselined`
      drift states."

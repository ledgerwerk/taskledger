    section_hash: aa5bfc66ff929aad127311e461e01f7e8f3db1cf333e23ec55359cc42a56648a
    summary: Core agent path
    text: "### Core agent path


      Agents should start with this durable lifecycle path:


      `plan start -> plan guidance -> plan template -> plan check -> plan upsert ->
      plan lint -> plan accept` is

      the normal planning/approval path for agents.


      - `actor whoami`

      - `task active`, `task show`, `task create`, `task activate`, `task follow-up`

      - `next-action`, `context`, `can`

      - `plan start`, `plan guidance`, `plan template`, `plan check`, `plan upsert`,
      `plan lint`, `plan accept`

      - `question add`, `question add-many`, `question answer`, `question answer-many`,
      `question status`, `question answers`

      - `todo next`, `todo show`, `todo done`, `todo status`

      - `implement start`, `implement resume`, `implement change`, `implement scan-changes`,
      `implement finish`

      - `validate start`, `validate status`, `validate check`, `validate finish`

      - `review record`

      - `handoff create`, `handoff show`, `handoff claim`, `handoff close`"
